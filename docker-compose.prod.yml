services:
  postgres:
    image: postgres:12.2-alpine
    environment:
      - POSTGRES_DB=nakama
      - POSTGRES_PASSWORD=localdb
    ports:
      - "5432:5432"

  nakama:
    image: ${DOCKERHUB_USERNAME}/nakama-tictactoe:latest
    restart: always
    environment:
      - NAKAMA_DATABASE_ADDRESS=postgres:localdb@postgres:5432/nakama
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"
    depends_on:
      - postgres
