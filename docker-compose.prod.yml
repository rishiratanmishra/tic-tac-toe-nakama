version: '3'
services:
  postgres:
    image: postgres:12.2-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: localdb

  nakama:
    image: docker.io/rishiratanmishra1/nakama-tictactoe:latest
    restart: always
    depends_on:
      - postgres
    environment:
      NAKAMA_DATABASE_ADDRESS: postgres:localdb@postgres:5432/nakama
      NAKAMA_NETWORK_ALLOWED_ORIGINS: "*"
    command: >
      sh -c "
      echo 'Waiting for Postgres...' &&
      until nc -z postgres 5432; do sleep 2; done &&

      echo 'Running migrations...' &&
      /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama &&

      echo 'Starting Nakama...' &&
      exec /nakama/nakama --config /nakama/data/local.yml --database.address postgres:localdb@postgres:5432/nakama
      "